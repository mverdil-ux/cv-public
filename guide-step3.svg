  <path d="M340 132 V150 M333 144 L340 152 L347 144" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="322" y="172" width="36" height="16" rx="4" fill="#ef4444"/>
  <text x="340" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#ffffff">PDF</text>

  <!-- Step 3 Badge -->
  <circle cx="42" cy="30" r="16" fill="#059669"/>
  <text x="42" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#ffffff">3</text>
