<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="sh1" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="220" rx="16" fill="url(#bg1)"/>

  <!-- Phone / Card Frame -->
  <rect x="48" y="18" width="304" height="184" rx="14" fill="#ffffff" filter="url(#sh1)"/>
  <!-- App Header -->
  <path d="M48 32 Q48 18 62 18 L338 18 Q352 18 352 32 L352 54 L48 54 Z" fill="#2563eb"/>
  <rect x="64" y="29" width="74" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
  <!-- Active Left Tab -->
  <rect x="48" y="54" width="152" height="20" fill="#1d4ed8"/>
  <rect x="100" y="61" width="48" height="6" rx="3" fill="#ffffff"/>
  <rect x="48" y="71" width="152" height="3" fill="#ffffff"/>
  <rect x="200" y="54" width="152" height="20" fill="#1e40af" opacity="0.5"/>
  <rect x="252" y="61" width="48" height="6" rx="3" fill="#bfdbfe"/>

  <!-- Highlighted Magic Wand Chip (Sample Fill) -->
  <rect x="66" y="84" width="96" height="24" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <path d="M78 96 L84 90 L86 92 L80 98 Z M85 88 L87 88 L87 90 L85 90 Z M89 92 L91 92 L91 94 L89 94 Z" fill="#d97706"/>
  <rect x="96" y="93" width="54" height="6" rx="3" fill="#b45309"/>

  <!-- Other Utility Chips -->
  <rect x="170" y="84" width="76" height="24" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="180" y="93" width="56" height="6" rx="3" fill="#64748b"/>
  <rect x="254" y="84" width="76" height="24" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="264" y="93" width="56" height="6" rx="3" fill="#64748b"/>

  <!-- Form Card Area -->
  <rect x="66" y="118" width="268" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <!-- Avatar circle -->
  <circle cx="94" cy="146" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="94" cy="141" r="5" fill="#2563eb"/>
  <path d="M84 156 Q94 148 104 156" fill="#2563eb"/>

  <!-- Input Lines -->
  <rect x="122" y="130" width="130" height="12" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="128" y="134" width="68" height="4" rx="2" fill="#94a3b8"/>
  <rect x="122" y="148" width="130" height="12" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="128" y="152" width="90" height="4" rx="2" fill="#94a3b8"/>
  <rect x="122" y="166" width="196" height="14" rx="4" fill="#ffffff" stroke="#cbd5e1"/>

  <!-- + Add & Order Controls -->
  <rect x="264" y="130" width="54" height="16" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <path d="M274 138 H282 M278 134 V142" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <rect x="287" y="136" width="22" height="4" rx="2" fill="#2563eb"/>

  <!-- Up/Down & Eye badges -->
  <rect x="264" y="150" width="16" height="12" rx="3" fill="#e2e8f0"/>
  <path d="M272 153 L275 157 H269 Z" fill="#475569"/>
  <rect x="283" y="150" width="16" height="12" rx="3" fill="#e2e8f0"/>
  <path d="M291 159 L294 155 H288 Z" fill="#475569"/>
  <rect x="302" y="150" width="16" height="12" rx="3" fill="#dbeafe"/>
  <circle cx="310" cy="156" r="3" fill="#2563eb"/>

  <!-- Pointer Badge Step 1 -->
  <circle cx="38" cy="96" r="16" fill="#f59e0b"/>
  <text x="38" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#ffffff">1</text>
  <path d="M54 96 H63" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
</svg>
